name: QA Automation & CI-CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 03:00 local (UTC-4) → 07:00 UTC — TEMP lab: keep only for a couple of days
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: qa-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Security — dependency audit (report) + Dependabot PRs (see .github/dependabot.yml)
  # Soft gate for now: findings are uploaded + shown in PR/Slack; CD is not blocked
  # until major bumps (vitest/pact) are validated. Industry often hard-fails on high/crit.
  # ---------------------------------------------------------------------------
  security-audit:
    name: Security (npm audit)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: npm audit (high+)
        id: audit
        continue-on-error: true
        run: |
          mkdir -p reports/security
          set +e
          npm audit --audit-level=high > reports/security/npm-audit.txt 2>&1
          code=$?
          npm audit --json > reports/security/npm-audit.json 2>/dev/null || true
          set -e
          echo "audit_exit=${code}" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "npm audit: no high/critical findings"
          else
            echo "result=findings" >> "$GITHUB_OUTPUT"
            echo "::warning::npm audit reported high/critical issues (see artifact security-npm-audit). Soft gate — review via Dependabot."
            head -n 80 reports/security/npm-audit.txt || true
          fi
          exit 0

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-npm-audit
          path: reports/security/
          retention-days: 30
          if-no-files-found: ignore

  # ===========================================================================
  # EDUCATIONAL ONLY (commented) — how a real "app build" artifact would look
  # This lab does NOT run a product build; we start provider:start / sample.apk instead.
  # In a real project you would UNCOMMENT jobs like these and wire needs/download.
  # ===========================================================================
  # build-web:
  #   name: Build web/API app
  #   if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4
  #     - name: Build (example)
  #       run: npm ci && npm run build
  #     - name: Upload web build artifact (FIXED name agreed with Dev/QA)
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: app-build-web       # ← fixed name (not the PR title)
  #         path: dist/
  #         retention-days: 7
  #
  # build-mobile:
  #   name: Build Android app (APK)
  #   if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4
  #     - name: Set up JDK
  #       uses: actions/setup-java@v4
  #       with:
  #         distribution: temurin
  #         java-version: '17'
  #     - name: Build debug APK (example)
  #       run: ./gradlew assembleDebug
  #       # or: cd android && ./gradlew assembleDebug
  #     - name: Upload mobile build artifact (FIXED name agreed with Dev/QA)
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: app-build-mobile    # ← fixed name for the APK
  #         path: app/build/outputs/apk/debug/*.apk
  #         retention-days: 7

  # ---------------------------------------------------------------------------
  # Web E2E + API (Playwright) — push / pull_request / manual
  # ---------------------------------------------------------------------------
  e2e-and-api-tests:
    name: E2E Web & API
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # needs: build-web             # ← EDUCATIONAL: wait for build-web job above
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # EDUCATIONAL: download the web build BEFORE tests (instead of provider:start)
      # - name: Download web app build artifact
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: app-build-web
      #     path: ./app-build

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Lab today: start mini catalog API here.
      # Real project: start/serve the downloaded app-build (or set BASE_URL to staging).
      - name: Start lab catalog provider
        run: |
          npm run provider:start &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4010/health >/dev/null; then
              echo "Provider is up"
              exit 0
            fi
            sleep 1
          done
          echo "Provider failed to start"
          exit 1

      - name: Run Web + API tests
        run: npm run test:e2e
        env:
          CI: true
          PROVIDER_BASE_URL: http://127.0.0.1:4010
          # BASE_URL: http://127.0.0.1:3000   # ← EDUCATIONAL: URL of app from app-build

      # These uploads are TEST REPORTS (QA output), not the app build.
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Contracts (Pact multi-consumer + Broker) — push / pull_request / manual
  # ---------------------------------------------------------------------------
  contract-tests:
    name: Pact Broker (multi-consumer)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Start Pact Broker
        run: |
          docker compose -f docker-compose.pact-broker.yml up -d
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9292 >/dev/null; then
              echo "Pact Broker is up"
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.pact-broker.yml logs
          exit 1

      - name: Start lab catalog provider
        run: |
          npm run provider:start &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4010/health >/dev/null; then
              echo "Provider is up"
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Generate consumer pacts (web-shop + mobile-shop)
        run: npm run test:contract:consumers

      - name: Publish pacts to Broker
        run: npm run test:contract:publish
        env:
          PACT_BROKER_BASE_URL: http://127.0.0.1:9292
          GITHUB_SHA: ${{ github.sha }}

      - name: Verify provider against Broker (multi-consumer)
        run: npm run test:contract:provider
        env:
          PROVIDER_BASE_URL: http://127.0.0.1:4010
          PACT_BROKER_BASE_URL: http://127.0.0.1:9292
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload generated pacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: tests/contract/pacts/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Mobile Android (Maestro) — push / pull_request / manual
  # ---------------------------------------------------------------------------
  mobile-tests:
    name: Mobile Android (Maestro)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # needs: build-mobile          # ← EDUCATIONAL: wait for build-mobile job above
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # EDUCATIONAL: download the APK from build-mobile BEFORE emulator/tests
      # - name: Download mobile app build artifact (APK)
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: app-build-mobile
      #     path: ./app-build
      # # Then in the emulator script: adb install -r app-build/*.apk
      # # and skip "maestro download-samples" (lab-only Wikipedia demo).

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Lab today: Wikipedia sample APK. Real project: use app-build from download-artifact above.
      - name: Download Maestro samples (sample.apk)
        run: maestro download-samples

      # CI uses API 30 (stable boot on GitHub runners). Local manual validation: API 33.
      - name: Run Maestro flow on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell getprop ro.build.version.sdk
            # EDUCATIONAL (real project, after download-artifact app-build-mobile):
            # adb install -r app-build/*.apk
            # Lab today (Wikipedia sample):
            adb install -r samples/sample.apk || adb install -r sample.apk
            mkdir -p reports/maestro
            maestro test tests/mobile/android-flow.yaml --format junit --output reports/maestro/results.xml || maestro test tests/mobile/android-flow.yaml

      # This upload is a TEST REPORT (QA output), not the app build APK.
      - name: Upload Maestro reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: reports/maestro/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Performance (k6) — schedule 03:00 UTC-4 + manual (TEMP: through ~2026-11-20)
  # ---------------------------------------------------------------------------
  performance-scheduled-tests:
    name: Performance (k6)
    if: >
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && (github.event_name != 'schedule' || github.event.schedule == '0 7 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check temporary cron window
        id: window
        run: |
          # Educational window through 2026-11-20 UTC; after that, scheduled runs no-op green
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          if [[ "$TODAY" > "2026-11-20" ]]; then
            echo "Temporary k6 cron lab ended ($TODAY > 2026-11-20)."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "Within temporary k6 cron window ($TODAY <= 2026-11-20)."
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.active == 'true'
        uses: actions/checkout@v4

      - name: Setup k6
        if: steps.window.outputs.active == 'true'
        uses: grafana/setup-k6-action@v1

      - name: Run stress test
        if: steps.window.outputs.active == 'true'
        run: |
          mkdir -p reports/k6
          k6 run tests/performance/stress-test.js \
            --summary-export=reports/k6/summary.json

      - name: Upload k6 summary
        if: always() && steps.window.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-report
          path: reports/k6/
          retention-days: 30
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # CD — Publish catalog API image to GHCR (after CI gates on main)
  # Educational stand-in for "ship the product": same idea as pushing an app image.
  # ---------------------------------------------------------------------------
  deliver-catalog-image:
    name: CD — Publish catalog image (GHCR)
    # Only Continuous Delivery on push to main/master (not PRs, not cron).
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    # Quality gate: do not publish if CI jobs failed.
    needs: [e2e-and-api-tests, contract-tests, mobile-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name (GHCR requires lowercase)
        id: image
        run: |
          # e.g. ghcr.io/haciendotestingqa/qa-automation-ci-cd-pipeline/catalog-api
          NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/catalog-api"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Publishing to: ${NAME}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---------------------------------------------------------------------------
  # Paso 9 industria — comentario sticky en PR + Slack opcional (webhook secret)
  # ---------------------------------------------------------------------------
  notify:
    name: Notify (PR + Slack)
    if: >
      always() &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    needs: [security-audit, e2e-and-api-tests, contract-tests, mobile-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Build summary
        id: summary
        run: |
          e2e="${{ needs.e2e-and-api-tests.result }}"
          pact="${{ needs.contract-tests.result }}"
          mobile="${{ needs.mobile-tests.result }}"
          sec="${{ needs.security-audit.result }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          cat > qa-summary.md <<EOF
          ## QA Lab summary

          | Job | Result |
          |-----|--------|
          | Security (npm audit) | \`${sec}\` |
          | E2E Web & API | \`${e2e}\` |
          | Pact Broker (multi-consumer) | \`${pact}\` |
          | Mobile Android (Maestro) | \`${mobile}\` |

          Run: ${run_url}

          _Security is a soft gate (artifact \`security-npm-audit\`). Dependabot opens weekly update PRs._
          EOF

          # Strip leading spaces from heredoc indentation
          sed -i 's/^          //' qa-summary.md

          {
            echo "slack<<EOF"
            echo "QA Lab — ${{ github.repository }} @ ${{ github.ref_name }}"
            echo "Security: ${sec} | E2E: ${e2e} | Pact: ${pact} | Mobile: ${mobile}"
            echo "${run_url}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Sticky comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: qa-lab-summary
          path: qa-summary.md
          recreate: true

      - name: Slack webhook (optional)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TEXT: ${{ steps.summary.outputs.slack }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "No SLACK_WEBHOOK_URL secret — skipping Slack notify."
            exit 0
          fi
          # Incoming Webhook expects JSON { "text": "..." }
          payload=$(jq -n --arg text "$SLACK_TEXT" '{text: $text}')
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
          echo "Slack notification sent."
